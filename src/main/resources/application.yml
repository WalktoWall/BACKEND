spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:~/mcmcanvas
    username: admin
    password: 1234

  h2:
    console:
      enabled: true
      path: /h2-console # 접속 경로 url 지정

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true

server:
  port: 8080 # default port
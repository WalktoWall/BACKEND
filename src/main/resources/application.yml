spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: false
#      enabled: true
#      path: /h2-console # 접속 경로 url 지정

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true

server:
  port: 8080 # default port

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4.1-mini
  image-model: gpt-image-2

#file:
#  upload-dir: uploads/wallarts/
file:
  # EC2 서버 내 절대 경로 설정 (끝에 / 꼭 붙이기)
  upload-dir: /var/app/uploads/wallarts/